services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio
    # Bound to loopback: the API runs outside the container in dev, so nothing
    # needs this port from the network, and the credentials here are trivial.
    #
    # Defaults to 5434, not 5432: every local Postgres wants 5432, and a
    # container from an unrelated project holding it is enough to stop this
    # one from starting. Sitting off the default keeps this project startable
    # without anyone having to shut down someone else's database. Still
    # overridable via POSTGRES_PORT (match it in DATABASE_URL).
    ports: ['127.0.0.1:${POSTGRES_PORT:-5434}:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
volumes:
  pgdata:
