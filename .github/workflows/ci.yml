name: CI

# Feature work is merged into dev, and dev is merged into main, so both need
# to be covered — gating only main would let every feature PR through
# unchecked and defeat the point of catching problems before review.
on:
  pull_request:
    branches: [main, dev]

# A new push to the same PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads the version from the packageManager field in package.json, so CI
      # and local development cannot drift apart.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check
        run: pnpm -r type-check

      # Integration (Testcontainers) and e2e (Playwright) stages get appended
      # by the sub-issues that introduce those suites — see docs/ci-cd.md.
      - name: Unit tests
        run: pnpm --filter api test

      - name: API e2e tests
        run: pnpm --filter api test:e2e
