# Stack de produção para o Dokploy (deployment type: Docker Compose).
#
# Nada de segredo aqui: todo valor sensível vem do ambiente, e o deploy falha
# se faltar. Os defaults `?err` abaixo são intencionais — um compose que sobe
# com senha em branco é pior do que um que recusa subir.
#
# Build a partir da raiz do repositório: é um workspace pnpm, e as imagens
# precisam do lockfile da raiz e de packages/shared (ver apps/*/Dockerfile).

services:
  api:
    # Só `image`, sem `build`. Com `build` presente, um `docker compose up`
    # constrói da origem quando a tag não está no cache local — e produção
    # voltaria a rodar um build diferente do que o CI validou, que é
    # exatamente o que a #38 existe para impedir.
    #
    # Para buildar localmente, sobreponha com docker-compose.build.yml.
    image: ${API_IMAGE:-bymyself-api}:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3100
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      # Contagem de saltos, não booleano — ver README. Atrás do proxy do
      # Dokploy é 1.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Fine-grained PAT, "Public Repositories (read-only)" -- ver
      # docs/decisao-projetos-github-pins.md.
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN is required}
      GITHUB_USERNAME: ${GITHUB_USERNAME:?GITHUB_USERNAME is required}
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      - traefik.http.routers.bymyself-api.rule=Host(`${API_DOMAIN:?API_DOMAIN is required}`)
      - traefik.http.routers.bymyself-api.entrypoints=web
      - traefik.http.routers.bymyself-api.middlewares=bymyself-https-redirect

      - traefik.http.routers.bymyself-api-secure.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.bymyself-api-secure.entrypoints=websecure
      - traefik.http.routers.bymyself-api-secure.tls=true
      - traefik.http.routers.bymyself-api-secure.tls.certresolver=${CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.bymyself-api-secure.middlewares=bymyself-hsts
      - traefik.http.services.bymyself-api.loadbalancer.server.port=3100

      # Os middlewares são declarados aqui *e* no serviço `web`, com a mesma
      # definição, de propósito. O provider Docker do Traefik só enxerga
      # container em execução: declarados só num deles, se aquele parar ou
      # entrar em crash loop os middlewares somem da configuração, o Traefik
      # recusa criar os routers do outro e o domínio passa a responder 404
      # mesmo com o serviço saudável. Definições idênticas são deduplicadas.
      - traefik.http.middlewares.bymyself-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.bymyself-https-redirect.redirectscheme.permanent=true
      - traefik.http.middlewares.bymyself-hsts.headers.stsSeconds=31536000
      - traefik.http.middlewares.bymyself-hsts.headers.stsIncludeSubdomains=${HSTS_INCLUDE_SUBDOMAINS:-false}

  web:
    # Mesmo raciocínio da api — ver o comentário lá.
    image: ${WEB_IMAGE:-bymyself-web}:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3101
      HOSTNAME: 0.0.0.0
      API_URL: http://api:3100
      # Também em runtime: sitemap.xml é ISR de 1h e regenera lendo isto.
      FRONTEND_URL: ${FRONTEND_URL}
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      # HTTP: existe só para redirecionar. Sem este router o Traefik responde
      # 404 na porta 80 e um visitante que digitou o domínio sem esquema não
      # chega ao site (user story 3).
      - traefik.http.routers.bymyself-web.rule=Host(`${WEB_DOMAIN:?WEB_DOMAIN is required}`)
      - traefik.http.routers.bymyself-web.entrypoints=web
      - traefik.http.routers.bymyself-web.middlewares=bymyself-https-redirect

      # HTTPS
      - traefik.http.routers.bymyself-web-secure.rule=Host(`${WEB_DOMAIN}`)
      - traefik.http.routers.bymyself-web-secure.entrypoints=websecure
      - traefik.http.routers.bymyself-web-secure.tls=true
      # Emissão e renovação automáticas (user story 2). `letsencrypt` é o nome
      # do resolver que o Dokploy já configura no Traefik dele.
      - traefik.http.routers.bymyself-web-secure.tls.certresolver=${CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.bymyself-web-secure.middlewares=bymyself-hsts
      - traefik.http.services.bymyself-web.loadbalancer.server.port=3101

      # `www` não é roteado aqui de propósito — ver "www" em deploy/dokploy.md.
      # Resumo: sem registro DNS para www, o nome não resolve e nunca chega
      # neste proxy, então não há caminho quebrado a fechar. Se um registro
      # www for criado, aí sim ele precisa de router próprio, e as labels
      # estão documentadas lá.

      # Middlewares compartilhados. Repetidos no serviço `api` de propósito —
      # ver o comentário lá.
      - traefik.http.middlewares.bymyself-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.bymyself-https-redirect.redirectscheme.permanent=true

      # HSTS. Foi deliberadamente deixado de fora do next.config.ts em #72
      # ("pertence ao terminador TLS") — este é o terminador.
      #
      # `preload` fica de fora: entrar na lista de preload dos browsers é
      # praticamente irreversível e trava o domínio inteiro em HTTPS por anos.
      # Isso é uma decisão do dono do domínio, não um default de config.
      - traefik.http.middlewares.bymyself-hsts.headers.stsSeconds=31536000
      - traefik.http.middlewares.bymyself-hsts.headers.stsIncludeSubdomains=${HSTS_INCLUDE_SUBDOMAINS:-false}

networks:
  # Rede interna da stack.
  default:

  # Criada pelo próprio Dokploy na instalação; o Traefik dele escuta nela.
  # `external: true` significa "use a existente", não "crie": se o compose
  # criasse a sua, o Traefik não enxergaria estes containers e o domínio
  # responderia 404.
  dokploy-network:
    external: true

# Como o tráfego externo entra
# ----------------------------
# Nenhum serviço publica porta no host. Quem escuta 80/443 é o Traefik do
# Dokploy; api e web são alcançados por ele através de `dokploy-network`, e o
# roteamento é por `Host()`, não por porta.
#
# Todo request em HTTP é redirecionado para HTTPS com 301 permanente, e o
# certificado é emitido e renovado pelo Let's Encrypt via resolver do Dokploy
# (#37).
